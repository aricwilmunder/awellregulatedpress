<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pownalborough Court House — HABS Drawing Viewer</title>
<link href="images/favicon-16.png" rel="icon" sizes="16x16" type="image/png">
<link href="images/favicon-32.png" rel="icon" sizes="32x32" type="image/png">
<link href="images/apple-touch-icon.png" rel="apple-touch-icon">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#222;background:#d8d5cf}
.app{height:100dvh;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #ccc;flex-shrink:0;flex-wrap:wrap;z-index:2}
.toolbar strong{font-size:15px;margin-right:12px}.toolbar button,.toolbar select,.toolbar .home-link{font:inherit;background:white;color:#222;border:1px solid #bbb;border-radius:5px;padding:6px 10px;cursor:pointer}.toolbar button:hover,.toolbar .home-link:hover{background:#eee}.toolbar .home-link{text-decoration:none;display:inline-flex;align-items:center}.toolbar .status{color:#666;font-size:12px;margin-left:auto}.viewer{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;touch-action:none}.viewer.dragging{cursor:grabbing}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#ffffffdd;border-radius:5px;padding:5px 10px;color:#555;font-size:12px;pointer-events:none;white-space:nowrap}.sheetstrip{height:90px;flex-shrink:0;background:#faf9f6;border-top:1px solid #ccc;display:flex;gap:7px;padding:7px;overflow-x:auto;overflow-y:hidden}.sheet-btn{flex:0 0 105px;display:flex;align-items:center;gap:5px;flex-direction:column;border:1px solid #ccc;border-radius:5px;background:#fff;padding:3px;cursor:pointer;color:#222;font-size:11px}.sheet-btn.active{outline:2px solid #333}.sheet-btn img{height:49px;max-width:94px;object-fit:contain}.sheet-btn:hover{background:#eee}@media(max-width:650px){.toolbar strong{width:100%}.toolbar .status{margin-left:0}.sheetstrip{height:77px}.sheet-btn{flex-basis:85px}.sheet-btn img{height:36px}.hint{font-size:10px}}
/* Navigation guidance and sheet metadata share one dedicated toolbar row. */
.toolbar{display:flex;flex-wrap:wrap}
.toolbar-info{flex:0 0 100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:18px;gap:12px}
.nav-help{grid-column:2;font-size:12px;color:#666;white-space:nowrap;text-align:center}
.toolbar .status{grid-column:3;justify-self:end;margin:0;color:#666;font-size:12px;text-align:right;white-space:nowrap}
@media(max-width:750px){.toolbar-info{grid-template-columns:1fr;gap:3px}.nav-help,.toolbar .status{grid-column:1;justify-self:center;text-align:center;white-space:normal}}

</style>
<!-- Counter.dev -->
<script>
      if (localStorage.getItem("CounterDevIgnore") !== "true") {
          const script = document.createElement("script");
          script.src = "https://cdn.counter.dev/script.js";
          script.dataset.id = "800e0f07-e8c7-43c4-bdaf-617aab5c0504";
          script.dataset.utcoffset = "-7";
          script.dataset.trackPath = "true";
          script.defer = true;
          document.head.appendChild(script);
      } else {
    	  console.log("Counter.dev disabled for this browser.");
      }
      </script>
</head>
<body><div class="app"><div class="toolbar"><a class="home-link" href="index.html" title="A Well-Regulated Press home">Home</a><strong>HABS Drawing Viewer</strong><button id="prev" title="Previous sheet">◀</button><select id="sheetSelect" aria-label="Select sheet"></select><button id="next" title="Next sheet">▶</button><button id="minus" title="Zoom out">−</button><button id="plus" title="Zoom in">+</button><button id="fit">Fit sheet</button><button id="actual">100%</button><span id="zoomLabel">100%</span><div class="toolbar-info"><span class="nav-help">Drag to pan · Scroll to zoom · Double-click to zoom</span><span class="status" id="status">Ready</span></div></div><div class="viewer" id="viewer"><canvas id="canvas"></canvas></div></div>
<script>
const sheetTitles=["The Measured Drawings Title Sheet", "Basement Plan", "First Floor Plan", "Second Floor Plan", "Third Floor Plan", "Roof Framing Plan", "Front South-East Elevation", "North-East Elevation", "Rear North-West Elevation", "South-West Elevation", "Transverse Section", "Plot Plan", "South-East Entrance", "North-East Entrance and Typical 1st and 2nd Floor Window", "North-West Entrance", "Kitchen", "Door Schedule", "North-East Bedroom, Second Floor", "South-East Bedroom, Third Floor and Original Wrought Iron Hardware", "Original Hardware"];
const sheets=Array.from({length:20},(_,i)=>`assets/HABS/drawings/master-pnp-habshaer-me-me0000-me0080-sheet-${String(i).padStart(5,'0')}a.jpg`);
const viewer=document.getElementById('viewer'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),zoomLabel=document.getElementById('zoomLabel'),select=document.getElementById('sheetSelect');
let img=new Image(),index=0,scale=1,panX=0,panY=0,drag=null,request=0,loadToken=0;
function size(){const r=viewer.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';draw()}
function draw(){if(!canvas.width)return;const dpr=window.devicePixelRatio||1;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#d8d5cf';ctx.fillRect(0,0,canvas.width,canvas.height);if(!img.naturalWidth)return;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*panX,dpr*panY);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0);zoomLabel.textContent=Math.round(scale*100)+'%'}
function redraw(){if(!request)request=requestAnimationFrame(()=>{request=0;draw()})}
function fit(){if(!img.naturalWidth)return;scale=Math.min(viewer.clientWidth/img.naturalWidth,viewer.clientHeight/img.naturalHeight);center();redraw()}
function center(){panX=(viewer.clientWidth-img.naturalWidth*scale)/2;panY=(viewer.clientHeight-img.naturalHeight*scale)/2}
function zoom(factor,x=viewer.clientWidth/2,y=viewer.clientHeight/2){if(!img.naturalWidth)return;const next=Math.max(.02,Math.min(16,scale*factor));panX=x-(x-panX)*next/scale;panY=y-(y-panY)*next/scale;scale=next;redraw()}
function load(i){const token=++loadToken;index=(i+sheets.length)%sheets.length;const target=index;select.value=index;document.querySelectorAll('.sheet-btn').forEach((b,n)=>b.classList.toggle('active',n===index));statusEl.textContent='Loading '+(target===0?'cover':`sheet ${target}`)+'…';const next=new Image();next.onload=()=>{if(token!==loadToken)return;img=next;fit();statusEl.textContent=`${img.naturalWidth.toLocaleString()} × ${img.naturalHeight.toLocaleString()} px`};next.onerror=()=>{if(token===loadToken)statusEl.textContent='Unable to load '+sheets[target]};next.src=sheets[target]}
sheets.forEach((path,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=i===0?'Cover — The Measured Drawings Title Sheet':`Sheet ${i} — ${sheetTitles[i]}`;select.append(opt)});
select.onchange=()=>load(Number(select.value));document.getElementById('prev').onclick=()=>load(index-1);document.getElementById('next').onclick=()=>load(index+1);document.getElementById('plus').onclick=()=>zoom(1.5);document.getElementById('minus').onclick=()=>zoom(1/1.5);document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>{if(!img.naturalWidth)return;const cx=(viewer.clientWidth/2-panX)/scale,cy=(viewer.clientHeight/2-panY)/scale;scale=1;panX=viewer.clientWidth/2-cx;panY=viewer.clientHeight/2-cy;redraw()};
viewer.addEventListener('wheel',e=>{e.preventDefault();const r=viewer.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});viewer.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};viewer.setPointerCapture(e.pointerId);viewer.classList.add('dragging')});viewer.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;redraw()});function stop(){drag=null;viewer.classList.remove('dragging')}viewer.addEventListener('pointerup',stop);viewer.addEventListener('pointercancel',stop);viewer.addEventListener('dblclick',e=>{const r=viewer.getBoundingClientRect();zoom(2,e.clientX-r.left,e.clientY-r.top)});window.addEventListener('resize',size);new ResizeObserver(size).observe(viewer);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='+')zoom(1.5);if(e.key==='-')zoom(1/1.5);if(e.key==='ArrowRight')load(index+1);if(e.key==='ArrowLeft')load(index-1)});size();load(0);
</script></body></html>
